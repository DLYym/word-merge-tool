name: Build Windows EXE

on:
  workflow_dispatch: {}
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # Python 3.8 是最后支持 Windows 7 的版本（3.9+ 不支持 Win7）。
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyInstaller 5.x 是最后支持 Windows 7 的版本，6.x 起不再支持 Win7。
          pip install pywin32 pyinstaller==5.13.2

      - name: Build EXE
        run: |
          pyinstaller --noconsole --onefile --name WordMergeTool --icon app.ico word_merge_tool.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WordMergeTool
          path: dist/WordMergeTool.exe
